 ,			frame-back-step																		#! 播放 > 上一帧
 .			frame-step																			#! 播放 > 下一帧
 l			ab-loop																				#! 播放 > 设置/清除 AB循环点
 BS			no-osd set speed    1 ; script-message-to uosc flash-elements speed					#! 播放 > 重置播放速度
 UP			no-osd add volume  10 ; script-message-to uosc flash-elements volume				#! 播放 > 音量 +
 DOWN		no-osd add volume -10 ; script-message-to uosc flash-elements volume				#! 播放 > 音量 -
 c			add audio-delay -0.1																#! 播放 > 同步 > 音频预载 0.1s
 v			add audio-delay  0.1																#! 播放 > 同步 > 音频延迟 0.1s
 z			add sub-delay -0.1																	#! 播放 > 同步 > 字幕预载 0.1s
 x			add sub-delay +0.1																	#! 播放 > 同步 > 字幕延迟 0.1s
 Shift+BS	set audio-delay 0 ; set sub-delay 0													#! 播放 > 重置音频字幕同步

 Ctrl+0		change-list glsl-shaders clr ""														#! 着色器 > 清空
 Ctrl+1		change-list glsl-shaders toggle "~~/shaders/KrigBilateral.glsl"						#! 着色器 > 开关 Krig
 Ctrl+2		change-list glsl-shaders toggle "~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl"		#! 着色器 > 开关 A4K_重建
 Ctrl+3		change-list glsl-shaders toggle "~~/shaders/Anime4K_Clamp_Highlights.glsl"			#! 着色器 > 开关 A4K_Clamp_HL
 Ctrl+4		change-list glsl-shaders toggle "~~/shaders/SSimSuperRes.glsl"						#! 着色器 > 开关 SSimSuperRes
 Ctrl+5		change-list glsl-shaders toggle "~~/shaders/SSimDownscaler.glsl"					#! 着色器 > 开关 SSimDownscaler
 Ctrl+6		change-list glsl-shaders toggle "~~/shaders/FSRCNNX_x2_8_0_4_1_LineArt.glsl"		#! 着色器 > 开关 FSRCNNX
 
#			cycle-values hwdec "auto" "auto-copy" "no"											#! 视频 > 切换解码
#			cycle deinterlace																	#! 视频 > 去隔行状态
#			cycle deband																		#! 视频 > 去色带状态
#			cycle icc-profile-auto																#! 视频 > 自动校色
#			cycle correct-pts																	#! 视频 > 时间码解析模式
 1			add contrast -1																		#! 视频 > 均衡器 > 对比度 -
 2			add contrast  1																		#! 视频 > 均衡器 > 对比度 +
 3			add brightness -1																	#! 视频 > 均衡器 > 亮度/明度 -
 4			add brightness  1																	#! 视频 > 均衡器 > 亮度/明度 +
 5			add gamma -1																		#! 视频 > 均衡器 > 伽马 -
 6			add gamma  1																		#! 视频 > 均衡器 > 伽马 +
 7			add saturation -1																	#! 视频 > 均衡器 > 饱和度/纯度 -
 8			add saturation  1																	#! 视频 > 均衡器 > 饱和度/纯度 +
 9			add hue -1																			#! 视频 > 均衡器 > 色相 -
 0			add hue  1																			#! 视频 > 均衡器 > 色相 +
 Ctrl+BS	set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0		#! 视频 > 重置均衡器

 Ctrl+i		script-binding uosc/keybinds														#! 工具 > 按键绑定列表
 i			script-binding display-stats-toggle													#! 工具 > 常驻显示统计信息
 `			script-binding console/enable														#! 工具 > 显示控制台
 Ctrl+r		script-message-to save_global_props clean_data										#! 工具 > 清除已记录的属性值
#			cycle border																		#! 工具 > 切换 窗口边框
#			cycle ontop																			#! 工具 > 切换 窗口置顶
