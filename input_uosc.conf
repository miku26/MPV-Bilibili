### ——————————————————————— 快捷键 ————————————————————————

 MBTN_LEFT_DBL	cycle fullscreen																# 切换全屏
 f				cycle fullscreen																# 切换全屏
 ESC			set fullscreen no																# 退出全屏
 MBTN_RIGHT		script-binding uosc/menu														# 上下文菜单
 MBTN_LEFT		cycle pause																		# 播放/暂停
 SPACE			cycle pause																		# 播放/暂停
 PLAYPAUSE		cycle pause																		# 播放/暂停
 MBTN_BACK		playlist-prev																	# 上一话
 MBTN_FORWARD	playlist-next																	# 下一话
 [				playlist-prev																	# 上一话
 ]				playlist-next																	# 下一话
 WHEEL_UP		no-osd add volume 1 ; script-message-to uosc flash-elements volume				# 音量 +
 WHEEL_DOWN		no-osd add volume -1 ; script-message-to uosc flash-elements volume				# 音量 -
 m				no-osd cycle mute																# 切换静音
 q				quit																			# 退出mpv
 s				screenshot																		# 截图
 ctrl+l			script-binding uosc_danmaku/load-danmaku
 
 LEFT			no-osd seek -5																	# 快退5秒
 RIGHT			no-osd seek  5																	# 快进5秒
 
 PGUP			no-osd add chapter -1															# 上一章
 PGDWN			no-osd add chapter  1															# 下一章